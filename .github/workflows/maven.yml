# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main", "release/**" ]
  pull_request:
    branches: [ "main", "release/**" ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        jdk: [21]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.head_ref || github.ref }}

    - name: Set up JDK ${{ matrix.jdk }}
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        java-version: ${{ matrix.jdk }}
        distribution: 'temurin'
        cache: maven

    - name: Set up cache date
      shell: bash
      run: echo "CACHE_DATE=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"

    - name: Cache Maven repository
      id: maven-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-${{ env.CACHE_DATE }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Cache DKPro Core dataset repository
      id: dataset-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          cache
        key: ${{ runner.os }}-dataset-${{ hashFiles('**/*') }}-${{ env.CACHE_DATE }}
        restore-keys: |
          ${{ runner.os }}-dataset-

    - name: Build with Maven
      run: mvn --no-transfer-progress -B clean verify --file pom.xml

    # Fails with error message - no idea why...
