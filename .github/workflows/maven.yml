# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main", "release/**" ]
  pull_request:
    branches: [ "main", "release/**" ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        jdk: [21]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        ref: ${{ github.head_ref || github.ref }}

    - name: Set up JDK ${{ matrix.jdk }}
      uses: actions/setup-java@v6.2.0
      with:
        java-version: ${{ matrix.jdk }}
        distribution: 'temurin'

    - name: Set up cache date
      shell: bash
      run: echo "CACHE_DATE=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"

    # We cache the Maven repository ourselves instead of using "cache: maven" in setup-java.
    # setup-java keys its cache on a hash of all pom.xml files and restores exact matches only,
    # so every POM change (e.g. any dependency upgrade) starts from an empty repository and
    # downloads all the large model artifacts again. Our cache falls back to the most recent
    # entry via restore-keys and is refreshed daily via the CACHE_DATE in its key.
    - name: Cache Maven repository
      id: maven-cache
      uses: actions/cache@v6.1.0
      with:
        path: |
          ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-${{ env.CACHE_DATE }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Cache DKPro Core dataset repository
      id: dataset-cache
      uses: actions/cache@v6.1.0
      with:
        path: |
          cache
        key: ${{ runner.os }}-dataset-${{ hashFiles('**/*') }}-${{ env.CACHE_DATE }}
        restore-keys: |
          ${{ runner.os }}-dataset-

    - name: Build with Maven
      run: mvn --no-transfer-progress -B clean verify --file pom.xml
